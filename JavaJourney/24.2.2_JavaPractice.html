<!-- success.html -->

<!DOCTYPE html>
<html>
    <head>
        <title>Success Message</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body{
                height: 100vh;
                weight : 100vw;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            div{
                height: 150px;
                weight : 450px;
                background-color: Green;
                color: white;
                text-align: center;
                 padding: 1.5rem;
                border-radius: 16px;
            }
            button{
                padding: 10px;
                background-color: black;
            }
            a{
                 color: white;
                 text-decoration: none;
                 font-weight: 700;
            }
        </style>
           
    </head>
    <body>
        <div>
            <h1>Login Successfully</h1>
            <button><a href="Login.jsp"> Go BACK</a></button>
        </div>
    </body>
</html>
