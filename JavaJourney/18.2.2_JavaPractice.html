<!DOCTYPE html>
<html>
    <head>
        <title>Enter Student Details</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body{
                height: 100vh;
                weight: 100vw;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            form{
                height: 300px;
                width: 400px;
                background-color: white;
                box-shadow: 10px 10px 20px gray;
                padding: 1rem;
                border-radius: 9px;
                gap: 50px;
            }
            input{
                padding: 10px;
                border-radius: 9px;
            }
            button{
                padding: 1rem 2rem;
                background-color: #6a11cb;
                color: white;
            }
            
            
        </style>
    </head>
    <body>
        <form action="StudentServlet" method="post">
            <b>Seat No</b>   : <input type="text" name="seatno"><br><br>
            <b>Name   </b>   : <input type="text" name="name"><br><br>
            <b>Class  </b>   : <input type="text" name="class"><br><br>
            <b>Total Marks(out of 500) </b> : <input type="text" name="marks"><br><br>
            
            <button>Submit</button>
        </form>
    </body>
</html>
